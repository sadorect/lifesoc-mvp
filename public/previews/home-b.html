<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0d1117">
<title>Preview B · Minimal · LifeSOC</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0b0f15; --surface:#161b22; --raised:#21262d; --border:#30363d; --t1:#e6edf3; --t2:#9da7b3; --t3:#6e7681; --blue:#388bfd; --blue2:#58a6ff; }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--t2); font:15px/1.55 Inter, system-ui, sans-serif; -webkit-font-smoothing:antialiased; display:flex; flex-direction:column; }
  .preview-bar { display:flex; gap:12px; justify-content:center; align-items:center; flex-wrap:wrap; padding:8px 16px; background:#1f6feb; color:#fff; font-size:13px; font-weight:500; position:relative; z-index:3; }
  .preview-bar a { color:#fff; opacity:.85; } .preview-bar a[aria-current] { opacity:1; font-weight:700; text-decoration:none; }
  /* background: faint grid + radar rings + slow sweep */
  .bg { position:fixed; inset:0; overflow:hidden; pointer-events:none; }
  .bg::before { content:""; position:absolute; inset:0;
    background-image: linear-gradient(rgba(88,166,255,.06) 1px, transparent 1px), linear-gradient(90deg, rgba(88,166,255,.06) 1px, transparent 1px);
    background-size: 44px 44px; mask-image: radial-gradient(circle at 50% 45%, #000 0%, transparent 70%); -webkit-mask-image: radial-gradient(circle at 50% 45%, #000 0%, transparent 70%); }
  .rings { position:absolute; left:50%; top:45%; width:1100px; height:1100px; transform:translate(-50%,-50%); border-radius:50%;
    background: repeating-radial-gradient(circle, transparent 0 109px, rgba(88,166,255,.09) 109px 110px); }
  .sweep { position:absolute; left:50%; top:45%; width:1100px; height:1100px; transform:translate(-50%,-50%); border-radius:50%;
    background: conic-gradient(from 0deg, rgba(56,139,253,.16), transparent 18%); animation: spin 9s linear infinite; mask-image: radial-gradient(circle, #000 0 50%, transparent 70%); -webkit-mask-image: radial-gradient(circle, #000 0 50%, transparent 70%); }
  @keyframes spin { to { transform:translate(-50%,-50%) rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .sweep { animation:none; } }
  main { position:relative; z-index:2; flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:40px 16px; gap:26px; }
  .id { text-align:center; }
  .id img { width:64px; height:64px; filter: drop-shadow(0 10px 30px rgba(56,139,253,.45)); }
  .id h1 { margin:12px 0 4px; color:var(--t1); font-size:30px; letter-spacing:-.6px; font-weight:800; } .id h1 b { color:var(--blue); }
  .id p { margin:0; color:var(--t2); }
  .card { width:100%; max-width:380px; background:rgba(22,27,34,.88); backdrop-filter: blur(8px); border:1px solid var(--border); border-radius:14px; padding:24px; box-shadow:0 20px 60px rgba(0,0,0,.45); }
  .google { width:100%; display:flex; align-items:center; justify-content:center; gap:10px; padding:11px; border-radius:9px; border:1px solid #444c56; background:var(--raised); color:var(--t1); font:500 15px Inter, sans-serif; }
  .or { display:flex; align-items:center; gap:10px; margin:16px 0; color:var(--t3); font-size:12px; } .or::before, .or::after { content:""; flex:1; height:1px; background:var(--border); }
  label { display:block; font-size:13px; font-weight:500; color:var(--t2); margin:0 0 6px; }
  input { width:100%; padding:11px 12px; border-radius:9px; border:1px solid var(--border); background:var(--raised); color:var(--t1); font:16px Inter, sans-serif; margin-bottom:14px; }
  .primary { width:100%; padding:12px; border:none; border-radius:9px; background:var(--blue); color:#fff; font:600 15px Inter, sans-serif; margin-top:4px; }
  .links { display:flex; justify-content:space-between; margin-top:14px; font-size:13px; } .links a { color:var(--blue2); text-decoration:none; }
  .chips { display:flex; flex-wrap:wrap; justify-content:center; gap:8px; max-width:520px; }
  .chip { font-size:12.5px; color:var(--t2); border:1px solid var(--border); background:rgba(22,27,34,.7); padding:5px 11px; border-radius:999px; }
  footer { position:relative; z-index:2; text-align:center; padding:0 16px 22px; font-size:12px; color:var(--t3); } footer a { color:var(--t2); }
</style>
</head>
<body>
<div class="preview-bar">Preview, not live ·
  <a href="/previews/home-a.html">A: Landing page</a>
  <a href="/previews/home-b.html" aria-current="page">B: Minimal</a>
  <a href="/previews/home-c.html">C: Split screen</a>
</div>
<div class="bg" aria-hidden="true"><div class="rings"></div><div class="sweep"></div></div>

<main>
  <div class="id">
    <img src="/logo-mark.svg" alt="">
    <h1>Life<b>SOC</b></h1>
    <p>Your personal security operations centre</p>
  </div>

  <div class="card">
    <button class="google" type="button">
      <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
      Continue with Google
    </button>
    <div class="or">or</div>
    <label>Email</label><input type="email" placeholder="you@example.com">
    <label>Password</label><input type="password">
    <button class="primary" type="button">Sign in</button>
    <div class="links"><a href="#">Forgot password?</a><a href="#">Create an account</a></div>
  </div>

  <div class="chips" aria-label="What's inside">
    <span class="chip">Posture dashboard</span><span class="chip">Incident log</span><span class="chip">IoC Scanner</span><span class="chip">AI Analyst</span><span class="chip">Ebook &amp; audiobook</span>
  </div>
</main>

<footer>The companion app to <em>Zero Trust</em> by Tosin Omojola · <a href="/privacy">Privacy</a> · <a href="/terms">Terms</a></footer>
</body>
</html>
